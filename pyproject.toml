[project]
name = "mocap-overlay"
version = "0.1.0"
description = "Calibrate an Axis camera to Vicon and overlay mocap data on the video"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-contrib-python>=4.10",
    "pyyaml>=6.0",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["calib", "record", "overlay"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pylint.main]
extension-pkg-allow-list = ["cv2"]
generated-members = ["cv2.*"]

[tool.pylint.format]
max-line-length = 120

[tool.ruff]
line-length = 120

[tool.pylint.basic]
# Allow the math / transform naming from CLAUDE.md: K, R, T_cam_world, R_board_body, ...
good-names-rgxs = ["^[A-Z]\\w*$", "^[a-z]$"]
