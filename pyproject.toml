[project]
name = "mocap-overlay"
version = "0.1.0"
description = "AR overlays for motion-capture labs: calibrate an IP camera to Vicon and render tracked objects, trajectories and 3D models into the video, live or offline"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "moderngl>=5.13.0",
    "numpy>=1.26",
    "opencv-contrib-python>=4.10",
    "pillow>=13.0.0",
    "pyyaml>=6.0",
    "scipy>=1.17.1",
    "trimesh>=5.2.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["calib", "record", "overlay", "pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pylint.main]
extension-pkg-allow-list = ["cv2"]
generated-members = ["cv2.*", "moderngl.*"]

[tool.pylint.format]
max-line-length = 120

[tool.ruff]
line-length = 120

[tool.pylint.basic]
# Allow the math / transform naming from CLAUDE.md: K, R, T_cam_world, R_board_body, ...
good-names-rgxs = ["^[A-Z]\\w*$", "^[a-z]$"]
