# Vicon DataStream (Tracker 3.10). Host from the VICON_HOST environment variable.
host: ${VICON_HOST}:801            # set VICON_HOST (Vicon PC name or IP) in your environment
sdk_dir: third_party/vicon_sdk   # libViconDataStreamSDK_C.so + _CPP.so (not in git)
stream_mode: ServerPush          # ClientPull | ClientPullPreFetch | ServerPush

subjects:
  board: charuco_board           # Vicon object name of the ChArUco board, as in Tracker
  car: athena                    # Vicon object name of the RC car

world_up_axis: z                 # Vicon world axis pointing up
